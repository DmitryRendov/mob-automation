---

- name: Remove the game server database
  mysql_db: name={{ server_db_name }} state=absent

- name: Create a database of the game server
  mysql_db: name={{ server_db_name }} state=present

- name: Downloading the game server latest MySQL dump from the backup (Storage bucket)
  get_url:
    url="{{ server_dump_src }}"
    dest="{{ target_path }}"
  register: mysql_dump

- name: Restore it to the site database
  mysql_db: name={{ server_db_name }} state=import target={{ mysql_dump.dest }}
