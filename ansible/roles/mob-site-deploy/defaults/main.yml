target_path: /tmp
env_type: "dev"
site_folders:
  - { name: "public_html", mode: "775", user: "{{ site_user }}", group: "www-data" }
  - { name: "logs", mode: "775", user: "root", group: "adm" }
  - { name: "backups", mode: "775", user: "{{ site_user }}", group: "{{ site_group }}" }
  - { name: "tmp", mode: "777", user: "{{ site_user }}", group: "{{ site_group }}" }

