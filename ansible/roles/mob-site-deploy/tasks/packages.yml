---

- name: Installing base packages required for production
  apt: pkg={{ item }} state=present update_cache=yes
  with_items:
    # Source checkout
    - git
    # Build toolchain for mysqlclient / Pillow wheels
    - build-essential
    - pkg-config
    # Python 3 runtime + virtualenv
    - python3
    - python3-dev
    - python3-pip
    - python3-venv
    # MySQL/MariaDB client (mysqlclient build dep)
    - default-libmysqlclient-dev
    # Pillow imaging build deps
    - zlib1g
    - libfreetype6
    - libfreetype6-dev
    - libopenjp2-7-dev
    - libtiff5-dev
    - liblcms2-dev
    - libwebp-dev
    # AWS S3 access for dump/media restore
    - python3-boto3
    - python3-botocore
    # Web server
    - apache2
    - libapache2-mod-wsgi-py3
    - cronolog

- name: Installing extra packages for non-production environments
  apt: pkg={{ item }} state=present
  with_items:
    - libevent-dev
    - libxml2-dev
    - libxslt1-dev
  when: env_type is not defined or env_type != "live"
