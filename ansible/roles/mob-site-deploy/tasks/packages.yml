---

- name: Installing server-specific packages by APT
  apt: pkg={{item}} state=present
  with_items:
    - git
    - build-essential
    - python-setuptools
    - python-dev
    - python-pip
    - python-virtualenv
    - libevent-dev
    - libxml2-dev
    - libxslt1-dev
    - python-mysqldb
    - libmariadbclient-dev-compat
    - zlib1g
    - libfreetype6
    - libopenjp2-7-dev
    - libfreetype6-dev
    - libtiff5-dev
    - liblcms2-dev
    - libwebp-dev
    - apache2
    - libapache2-mod-wsgi
    - cronolog
