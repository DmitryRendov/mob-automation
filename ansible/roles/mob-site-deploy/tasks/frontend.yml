---

- name: Install frontend dependencies (npm)
  become: yes
  become_user: "{{ site_user }}"
  become_method: sudo
  npm:
    path: "{{ site_path }}/public_html/mob/static"
    state: present

- name: Ensure frontend local bin scripts are executable
  become: yes
  become_user: "{{ site_user }}"
  become_method: sudo
  shell: |
    if [ -d "{{ site_path }}/public_html/mob/static/node_modules/.bin" ]; then
      chmod 0755 "{{ site_path }}/public_html/mob/static/node_modules/.bin"/* || true
    fi

- name: Build frontend assets with Vite
  become: yes
  become_user: "{{ site_user }}"
  become_method: sudo
  command: npm run build
  args:
    chdir: "{{ site_path }}/public_html/mob/static/"
