---

- name: Remove the game server schema if exists
  mysql_db:
    name: "{{ server_db_name }}"
    state: absent

- name: Create a database of the game server
  mysql_db:
    name: "{{ server_db_name }}"
    state: present

- name: Download the game server latest MySQL dump from AWS S3
  amazon.aws.aws_s3:
    bucket: "{{ minecraft_db_src.0.bucket }}"
    object: "{{ minecraft_db_src.0.object }}"
    dest: "{{ temp_folder }}/survival.dump.tar.gz"
    mode: get
  register: mysql_dump

- name: Restore it to the site database
  mysql_db:
    name: "{{ server_db_name }}"
    state: import
    target: "{{ mysql_dump.dest }}"
    login_user: root
    login_password: "{{ mysql_root_password }}"

- name: Remove the downloaded MySQL dump file
  file:
    path: "{{ mysql_dump.dest }}"
    state: absent
  when: mysql_dump.changed