- name: Create the MOB site database
  mysql_db:
    name: "{{ site_db_name }}"
    encoding: "{{ mariadb_character_set | default('utf8mb4') }}"
    collation: "{{ mariadb_collation | default('utf8mb4_unicode_ci') }}"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_user: root
    login_password: "{{ mysql_root_password }}"

- name: Create the MOB site database user
  mysql_user:
    name: "{{ site_db_user }}"
    password: "{{ site_db_password }}"
    priv: "{{ site_db_name }}.*:ALL"
    host: "{{ item }}"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_user: root
    login_password: "{{ mysql_root_password }}"
  loop:
    - localhost
    - 127.0.0.1
  no_log: yes
