- name: Enable mysql_native_password plugin in server config
  lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: '^default_authentication_plugin='
    line: 'default_authentication_plugin=mysql_native_password'
    insertafter: '^\[mysqld\]'
    state: present
  notify: restart mariadb

- name: Disable unix_socket authentication for root using ALTER USER
  mysql_query:
    query: "ALTER USER 'root'@'localhost' IDENTIFIED VIA mysql_native_password USING PASSWORD('{{ mysql_root_password }}')"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  no_log: yes

- name: Set root password
  mysql_user:
    name: root
    password: "{{ mysql_root_password }}"
    host: localhost
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
  no_log: yes