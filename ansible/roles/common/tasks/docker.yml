---
- name: Get current Debian release name
  shell: lsb_release -cs
  register: debian_release
  changed_when: false

- name: Set Docker APT distribution
  set_fact:
    docker_apt_distro: "{{ 'ubuntu' if ansible_distribution == 'Ubuntu' else 'debian' }}"

- name: Install Docker repository prerequisites
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

- name: Ensure apt keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker official GPG key
  shell: >
    curl -fsSL https://download.docker.com/linux/{{ docker_apt_distro }}/gpg
    | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg

- name: Add apt repository for Docker CE
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/{{ docker_apt_distro }} {{ debian_release.stdout }} stable"
    state: present
    filename: docker
  when: debian_release.stdout

- name: Install Docker CE and compose plugin
  apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: yes

- name: Ensure Docker service is running
  service:
    name: docker
    state: started
    enabled: yes

- name: Add user to docker group
  user:
    name: "{{ user }}"
    groups: docker
    append: yes
