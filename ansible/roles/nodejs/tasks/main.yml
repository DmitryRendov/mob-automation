---

- name: Setting up pre-requirements
  apt:
    name:
      - build-essential
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

- name: Create apt keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download NodeSource GPG key
  get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /tmp/nodesource.asc
    mode: '0644'
    force: yes

- name: Install NodeSource keyring
  command: gpg --batch --yes --dearmor -o /etc/apt/keyrings/nodesource.gpg /tmp/nodesource.asc
  args:
    creates: /etc/apt/keyrings/nodesource.gpg

- name: Adding nodejs repos
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ nodejs_version }} nodistro main"
    state: present
    filename: nodesource
  register: repos

- name: Update apt cache
  apt: update_cache=yes
  when: repos.changed

- name: Installing nodejs {{ nodejs_version }}
  apt:
    name: nodejs
    state: present

