---

- name: Setting up pre-requirements
  apt: name={{ item }} state=present
  with_items:
    - build-essential
    - apt-transport-https

#- name: Adding nodejs gpg key
#  apt_key: url=https://deb.nodesource.com/gpgkey/nodesource.gpg.key  state=present

# Workarround in case of issue "Failed to validate the SSL certificate"
- name: add_docker_apt_key
  shell: "/usr/bin/curl https://deb.nodesource.com/gpgkey/nodesource.gpg.key | /usr/bin/apt-key add -"

- name: Adding nodejs repos
  apt_repository:  repo="{{ item }}" state=present
  with_items:
    - "deb https://deb.nodesource.com/node_{{ nodejs_version }} {{ ansible_distribution_release }} main"
    - "deb-src https://deb.nodesource.com/node_{{ nodejs_version }} {{ ansible_distribution_release }} main"
  register: repos

- name: Update apt cache
  apt: update_cache=yes
  when: repos.changed

- name: Installing nodejs {{ nodejs_version }}
  apt: "name=nodejs={{ nodejs_version|regex_replace('x', '') }}* state=present"


