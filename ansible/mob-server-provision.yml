# MOB server provisioning
#
# ansible-playbook -i ./inventory/dev  mob-server-provision.yml --extra-vars "env=mobserver-dev env_type=dev user=dmitry" -vv
# ansible-playbook -i ./inventory/live mob-server-provision.yml --extra-vars "env=mobserver password=VeryTopSecret123 env_type=live user=dmitry" -vv

- hosts: "{{env}}"
  user: "{{user}}"
  become: yes
  become_method: sudo
  gather_facts: true
  roles:
    - mob-server-provision
