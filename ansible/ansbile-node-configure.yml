# setup common system applications and configure Ansible node
# ansible-playbook -i ./inventory/live  ansbile-node-configure.yml --extra-vars "env=mobserver-gcloud user=minecraft user_home=/home/minecraft" -vv

- hosts: "{{env}}"
  user: "{{user}}"
  become: yes
  become_method: sudo
  gather_facts: true
  max_fail_percentage: 0
  roles:
    - common
    - { role: java1.8-oracle-debian, when: ansible_os_family == "Debian" and java_version == "1.8"}
    - ansible-node
